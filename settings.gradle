include(':microservices:iam-service:iam-persistence')
include(':microservices:iam-service:iam-message')
include(':microservices:iam-service:iam-infrastructure')
include(':microservices:iam-service:iam-common')

// Notification Service
include(':microservices:notification-service:notification-main')
include(':microservices:notification-service:notification-application:notification-restapi')
//include(':microservices:notification-service:notification-domain')
include(':microservices:notification-service:notification-domain:notification-application-service')
include(':microservices:notification-service:notification-domain:notification-domain-core')
include(':microservices:notification-service:notification-datapersistence')
include(':microservices:notification-service:notification-messaging')

// User Profile Service
include(':microservices:user-profile-service:user-profile-main')
include(':microservices:user-profile-service:user-profile-application:user-profile-restapi')
include(':microservices:user-profile-service:user-profile-datapersistence')
include(':microservices:user-profile-service:user-profile-message')
include(':microservices:user-profile-service:user-profile-domain:user-profile-application-service')
