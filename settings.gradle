plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = "stadoor"

// Root project for shared resources
include(':common:common-domain')

// Microservices with Hexagonal structure
// eureka-service
include(':microservices:eureka-service:eureka-application:eureka-restapi')
include(':microservices:eureka-service:common')
include(':microservices:eureka-service:eureka-webclient')
include(':microservices:eureka-service:eureka-domain:eureka-application-service')
include(':microservices:eureka-service:eureka-domain:eureka-domain-core')
include(':microservices:eureka-service:eureka-datapersistence')
include(':microservices:eureka-service:eureka-message')
include(':microservices:eureka-server')
include(':microservices:eureka-service:eureka-main')



// Consumer Service
include(':microservices:consumer-service:consumer-main')
include(':microservices:consumer-service:consumer-application:consumer-restapi')
include(':microservices:consumer-service:consumer-domain:consumer-application-service')
include(':microservices:consumer-service:consumer-domain:consumer-domain-core')
include(':microservices:consumer-service:consumer-datapersistence')
include(':microservices:consumer-service:consumer-message')

// IAM Service
include(':microservices:iam-service:iam-main')
include(':microservices:iam-service:iam-webui')
