// Gateway Service
include(':microservices:gateway-service:gateway-main')
include(':microservices:gateway-service:gateway-application:gateway-restapi')
include(':microservices:gateway-service:gateway-domain:gateway-application-service')
include(':microservices:gateway-service:gateway-domain:gateway-domain-core')
include(':microservices:gateway-service:gateway-datapersistence')
include(':microservices:gateway-service:gateway-message')
