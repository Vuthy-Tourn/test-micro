dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation project(':microservices:consumer-service:consumer-application:consumer-restapi')
    implementation project(':microservices:consumer-service:consumer-domain:consumer-application-service')
    implementation project(':microservices:consumer-service:consumer-domain:consumer-domain-core')
    implementation project(':microservices:consumer-service:consumer-datapersistence')
    implementation project(':microservices:consumer-service:consumer-message')
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    runtimeOnly 'org.postgresql:postgresql'
}
