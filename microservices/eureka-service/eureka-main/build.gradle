ext {
    springCloudVersion = "2025.1.1"
}
dependencies{

    implementation project(':microservices:eureka-service:eureka-application:eureka-restapi')
    implementation project(':microservices:eureka-service:eureka-message')
    implementation project(':microservices:eureka-service:common')
    implementation project(':microservices:eureka-service:eureka-domain:eureka-application-service')
    implementation project(':microservices:eureka-service:eureka-datapersistence')
    implementation project(':microservices:eureka-service:eureka-webclient')
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}
