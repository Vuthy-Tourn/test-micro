version: "3.8"

services:

  zookeeper-stadoor:
    image: confluentinc/cp-zookeeper:7.8.0
    container_name: zookeeper-stadoor
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - stadoor-net

  kafka-1-stadoor:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka-1-stadoor
    depends_on:
      - zookeeper-stadoor
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-stadoor:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1-stadoor:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - stadoor-net

  schema-registry-stadoor:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: schema-registry-stadoor
    depends_on:
      - kafka-1-stadoor
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry-stadoor
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1-stadoor:29092
    networks:
      - stadoor-net

  debezium-connect-stadoor:
    image: quay.io/debezium/connect:3.4.0.Final
    container_name: debezium-connect-stadoor
    depends_on:
      - kafka-1-stadoor
      - schema-registry-stadoor
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-1-stadoor:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry-stadoor:8081
      VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry-stadoor:8081
      REST_ADVERTISED_HOST_NAME: debezium-connect-stadoor
    networks:
      - stadoor-net

networks:
  stadoor-net:
    external: true
