services:
  kafka-broker-1:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka-broker-1
    restart: always
    ports:
      - "16704:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker-1:9091,2@kafka-broker-2:9091,3@kafka-broker-3:9091'
      KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://kafka-broker-1:9091,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:9090,EXTERNAL://localhost:16704
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - authgate_kafka_1_data:/var/lib/kafka/data
    networks:
      - authgate-net

  kafka-broker-2:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka-broker-2
    restart: always
    ports:
      - "16705:9094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker-1:9091,2@kafka-broker-2:9091,3@kafka-broker-3:9091'
      KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://kafka-broker-2:9091,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-2:9090,EXTERNAL://localhost:16705
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - authgate_kafka_2_data:/var/lib/kafka/data
    networks:
      - authgate-net

  kafka-broker-3:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka-broker-3
    restart: always
    ports:
      - "16706:9096"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker-1:9091,2@kafka-broker-2:9091,3@kafka-broker-3:9091'
      KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://kafka-broker-3:9091,EXTERNAL://:9096'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-3:9090,EXTERNAL://localhost:16706
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - authgate_kafka_3_data:/var/lib/kafka/data
    networks:
      - authgate-net

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui
    container_name: authgate-kafka-ui
    restart: always
    ports:
      - "18000:8080"
    environment:
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: authgate@168
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: authgate
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-broker-1:9090,kafka-broker-2:9090,kafka-broker-3:9090"
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
    networks:
      - authgate-net

volumes:
  authgate_kafka_1_data:
  authgate_kafka_2_data:
  authgate_kafka_3_data:

networks:
  authgate-net:
    external: true