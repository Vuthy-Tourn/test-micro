# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.notification-service.yaml
# GCP deployment – Notification Service + its dependencies
#
# Usage (GCP VM / Cloud Run):
#   docker compose -f docker-compose.notification-service.yaml up -d
#
# Required secrets (set as environment variables or via .env file):
#   SMTP_USERNAME, SMTP_PASSWORD
#   TELEGRAM_BOT_TOKEN, TELEGRAM_DEFAULT_CHAT_ID
#   EUREKA_SERVER_URL
#   GCP_PROJECT_ID  (used for image tagging when pushing to Artifact Registry)
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  stadoor_notification_data:
  mongodb_notification_log:

networks:
  stadoor-net:
    external: true

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────
  stadoor-notification-mongo:
    image: mongo:7
    container_name: stadoor-notification-mongo
    restart: unless-stopped
    ports:
      - "16710:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: stadoor
      MONGO_INITDB_ROOT_PASSWORD: stadoor
      MONGO_INITDB_DATABASE: notification_db
    volumes:
      - mongodb_notification_log:/var/log/mongodb
      - stadoor_notification_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - stadoor-net

  # ── Notification Service ─────────────────────────────────────────────────
  notification-service:
    # Build from source (monorepo root context) ──────────────────────────────
    # Uncomment the build block and comment out `image:` for local/CI builds.
    # build:
    #   context: ../../..                          # monorepo root
    #   dockerfile: microservices/notification-service/Dockerfile
    # ─────────────────────────────────────────────────────────────────────────
    # Pre-built image (Artifact Registry / Docker Hub) ───────────────────────
    image: ${GCP_REGION:-asia-southeast1}-docker.pkg.dev/${GCP_PROJECT_ID:-your-gcp-project}/stadoor/notification-service:${IMAGE_TAG:-latest}
    container_name: stadoor-notification-service
    restart: unless-stopped
    ports:
      - "16807:16807"
    environment:
      # ── Server ──
      SERVER_PORT: 16807
      SPRING_APPLICATION_NAME: notification

      # ── MongoDB ──
      MONGO_HOST: stadoor-notification-mongo
      MONGO_PORT: 27017

      # ── SMTP / Email ──
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}

      # ── Telegram ──
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-1249457390}

      # ── Kafka (Axon) ──
      # Point to your Kafka brokers — use internal Docker hostnames if
      # running in the same Compose project or the external IPs on GCP.
      AXON_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker-1:9090,kafka-broker-2:9090,kafka-broker-3:9090}

      # ── Eureka ──
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka}

      # ── JVM / container ──
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0

    depends_on:
      stadoor-notification-mongo:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16807/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.75"
        reservations:
          memory: 512M
          cpus: "0.25"

    networks:
      - stadoor-net
