eureka:
  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true

server:
  port: 16902

spring:
  application:
    name: admin-bff

  profiles:
    active: dev

  config:
    import: optional:configserver:http://localhost:8888

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Request-Headers
            - SaveSession
            - TokenRelay=
          routes:

            # ── Highest priority API routes ──────────────────────────────

            - id: gateway-service-api-services
              uri: http://localhost:16803
              order: -10
              predicates:
                - Path=/api/front-admin/services/**
              filters:
                - TokenRelay=
                - SaveSession
                - RewritePath=/api/front-admin/services(?<segment>/.*)?, /api/v1/services$\{segment}

            - id: gateway-service-api-routes
              uri: http://localhost:16803
              order: -10
              predicates:
                - Path=/api/front-admin/routes/**
              filters:
                - TokenRelay=
                - SaveSession
                - RewritePath=/api/front-admin/routes(?<segment>/.*)?, /api/v1/routes/query$\{segment}

            - id: iam-pat-api
              uri: http://localhost:16801
              order: -5
              predicates:
                - Path=/api/front-admin/pat/**
              filters:
                - TokenRelay=
                - SaveSession
                - RewritePath=/api/front-admin/pat/(?<segment>.*), /api/v1/iam/pat/${segment}

            - id: user-profile-service
              uri: http://localhost:16802
              order: -4
              predicates:
                - Path=/api/front-admin/users,/api/front-admin/users/**
              filters:
                - TokenRelay=
                - SaveSession
                - RewritePath=/api/front-admin/users(?<segment>/.*)?, /api/user-profile$\{segment}

            - id: gateway-service-admin-overview
              uri: http://localhost:16803
              order: -4
              predicates:
                - Path=/api/front-admin/gateways/dashboard/overview
              filters:
                - TokenRelay=
                - SaveSession
                - RewritePath=/api/front-admin/gateways/dashboard/overview, /api/v1/admin/overview

            - id: gateway-server-api
              uri: http://localhost:16903
              order: -3
              predicates:
                - Path=/api/front-admin/gateway-stats/**
              filters:
                - TokenRelay=
                - SaveSession
                - RewritePath=/api/front-admin/gateway-stats(?<segment>/.*)?, /actuator/gateway$\{segment}

            - id: gateway-service
              uri: http://localhost:16803
              order: -3
              predicates:
                - Path=/api/front-admin/gateways/**
              filters:
                - TokenRelay=
                - SaveSession
                - RewritePath=/api/front-admin/gateways(?<segment>/.*)?, /api/v1/gateways$\{segment}

            - id: consumer-service
              uri: http://localhost:16804
              order: -3
              predicates:
                - Path=/api/front-admin/consumers/**
              filters:
                - TokenRelay=
                - SaveSession
                - RewritePath=/api/front-admin/consumers(?<segment>/.*)?, /api/v1/consumers$\{segment}

            - id: eureka-service
              uri: http://localhost:16805
              order: -3
              predicates:
                - Path=/api/front-admin/eureka/**
              filters:
                - TokenRelay=
                - SaveSession
                - RewritePath=/api/front-admin/eureka(?<segment>/.*)?, /api/v1/eureka$\{segment}

            - id: notification-service
              uri: http://localhost:16807
              order: -3
              predicates:
                - Path=/api/front-admin/notifications/**
              filters:
                - TokenRelay=
                - SaveSession
                - RewritePath=/api/front-admin/notifications(?<segment>/.*)?, /api/v1/notifications$\{segment}

            # Catch-all for remaining /api/front-admin/** → IAM service
            - id: iam-service-api
              uri: http://localhost:16801
              order: -2
              predicates:
                - Path=/api/front-admin/**
              filters:
                - TokenRelay=
                - SaveSession
                - RewritePath=/api/front-admin/(?<segment>.*), /api/v1/iam/${segment}

            # ── UI routes ────────────────────────────────────────────────

            - id: iam-ui
              uri: http://localhost:3002
              order: -1
              predicates:
                - Path=/dashboard/**, /iam-static/**

            # ── Frontend catch-all — MUST be last ────────────────────────
            - id: adminbff
              uri: http://localhost:3000
              order: 100
              predicates:
                - Path=/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:16801
      client:
        registration:
          stadoor-admin-bff:
            provider: stadoor-auth-server
            client-id: stadoor-admin-bff
            client-secret: stadoor
            redirect-uri: "http://localhost:16902/login/oauth2/code/stadoor-admin-bff"
            scope:
              - openid
              - profile
              - email
        provider:
          stadoor-auth-server:
            issuer-uri: http://localhost:16801

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always