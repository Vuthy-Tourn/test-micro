server:
  port: ${PORT:16904}

spring:
  application:
    name: config-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native,vault}
  cloud:
    config:
      server:
        vault:
          host: ${VAULT_HOST}
          port: ${VAULT_PORT}
          scheme: ${VAULT_SCHEME:https}
          authentication: APPROLE
          app-role:
            role-id: ${VAULT_ROLE_ID}
            secret-id: ${VAULT_SECRET_ID}
          kv-version: 2
          backend: kv
          profile-separator: "/"
        git:
          uri: ${GH_URI}
          default-label: main
          search-paths: "/**"
          username: ${GH_USERNAME:}
          password: ${GH_TOKEN:}
        native:
          search-locations:
            - file:./config-repo/
            - file:./config-repo/{application}/

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
