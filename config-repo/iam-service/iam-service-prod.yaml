server:
  port: 16801

gg:
  jte:
    development-mode: false
    use-precompiled-templates: true

axon:
  kafka:
    bootstrap-servers: kafka-broker-1:9090,kafka-broker-2:9090,kafka-broker-3:9090
    client-id: kafka-iam-service
    message-converter-mode: default
    properties:
      security.protocol: PLAINTEXT
    publisher:
      confirmation-mode: transactional
    producer:
      retries: 3
      event-processor-mode: tracking
      transaction-id-prefix: kafka-axon-iam-txn
  eventhandling:
    processors:
      iam-service-group:
        mode: tracking
      kafka-publisher-group:
        mode: tracking
  axonserver:
    enabled: false
  serializer:
    events: jackson3
    general: jackson3
    messages: jackson3

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://authgate-iam:5432/iam_db
    username: authgate_iam
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://authgate-iam:5432/iam_db
    user: authgate_iam
    password: ${DB_PASSWORD}
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      authorizationserver:
        issuer: https://iam.authgate.site
      resourceserver:
        jwt:
          issuer-uri: https://iam.authgate.site

app:
  security:
    issuer: https://iam.authgate.site
    jwt:
      secret: ${jwt.secret}
    client-secret-key: ${client.secret.key}

eureka:
  client:
    service-url:
      defaultZone: http://authgate-eureka-server:8761/eureka/
  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
