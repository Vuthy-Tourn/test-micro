server:
  port: 16803

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:16801

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${INFRA_HOST}:16709/gateway_db
    username: authgate_gateway
    password: ${DB_PASSWORD}

  r2dbc:
    url: r2dbc:postgresql://${INFRA_HOST}:16709/gateway_db
    username: authgate_gateway
    password: ${DB_PASSWORD}

  liquibase:
    enabled: true
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${INFRA_HOST}:16709/gateway_db
    user: authgate_gateway
    password: ${DB_PASSWORD}
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

axon:
  axonserver:
    enabled: false
  kafka:
    bootstrap-servers: ${INFRA_HOST}:16704,${INFRA_HOST}:16705,${INFRA_HOST}:16706
    default-topic: ${GATEWAY_EVENTS_TOPIC:gateway.events.v1}
    publisher:
      enabled: true
    fetcher:
      enabled: false
  serializer:
    general: jackson
    events: jackson
    messages: jackson

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

logging:
  level:
    kh.edu.istad.stadoor.gateway: DEBUG
    org.springframework.web: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.data.r2dbc: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
    io.r2dbc.postgresql.PARAM: DEBUG
