server:
  port: 16903

spring:
  data:
    redis:
      host: authgate-redis
      port: 6379
      password: ${REDIS_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://iam.authgate.site
          jwk-set-uri: https://iam.authgate.site/oauth2/jwks

stadoor:
  clients:
    gateway-service:
      base-url: http://authgate-gateway-service:16803
    iam:
      base-url: http://authgate-iam-service:16801
    consumer:
      base-url: http://consumer-service:16804

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

eureka:
  client:
    service-url:
      defaultZone: http://authgate-eureka-server:8761/eureka/
  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true
