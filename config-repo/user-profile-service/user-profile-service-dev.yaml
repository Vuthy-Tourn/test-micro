server:
  port: 16802

spring:
  data:
    mongodb:
      uri: mongodb://authgate:${MONGO_PASSWORD}@${INFRA_HOST}:16702/stadoor_users_db?authSource=admin
      database: stadoor_users_db
      auto-index-creation: true

  mongodb:
    password: ${MONGO_PASSWORD}
    username: authgate
    database: stadoor_users_db
    host: ${INFRA_HOST}
    port: 16702
    auto-index-creation: true
    authentication-database: admin
    reactive:
      enabled: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:16801

axon:
  axonserver:
    enabled: false
  kafka:
    bootstrap-servers: ${INFRA_HOST}:16704,${INFRA_HOST}:16705,${INFRA_HOST}:16706
    client-id: user-profile-service
    default-topic: IAM.User.Event
    message-converter-mode: default
    properties:
      security.protocol: PLAINTEXT
    consumer:
      group-id: user-profile
      event-processor-mode: tracking
      auto-offset-reset: earliest
  eventhandling:
    processors:
      user-profile:
        mode: tracking
        source: streamableKafkaMessageSource
  serializer:
    events: jackson3
    messages: jackson3
    general: jackson3

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
