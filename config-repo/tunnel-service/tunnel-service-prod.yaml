# ================================================================
# Tunnel Service — PROD Configuration
# ================================================================

server:
  port: ${PORT:8080}

spring:
  application:
    name: tunnel-service

  main:
    web-application-type: reactive

  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      pool-name: TunnelHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: tunnel-proxy
              uri: no://op
              predicates:
                - Path=/**
              order: 0

          default-filters:
            - PreserveHostHeader

          httpclient:
            connect-timeout: 5000
            response-timeout: 30s

# ── Eureka Client ───────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://authgate-eureka-server:8761/eureka/

  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true

# ── SSH Tunnel ──────────────────────────────────────────────────
tunnel:
  ssh:
    port: ${SSH_PORT:2222}
    host-key-path: ${SSH_HOST_KEY:host.ser}

# ── Application Properties ─────────────────────────────────────
app:
  auth:
    mock-enabled: false

  iam:
    base-url: http://authgate-iam-service:16801

  tunnel:
    public-url: ${TUNNEL_PUBLIC_URL}

# ── Actuator ───────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    health:
      show-details: never

    gateway:
      enabled: true

# ── Logging ────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    kh.edu.istad.stadoor.tunnel: INFO
    org.springframework.cloud.gateway: INFO
    org.apache.sshd: INFO