server:
  port: 16901

stadoor:
  frontend:
    public-origin: http://localhost:3000
    gateway-origin: http://localhost:3001
    iam-origin: http://localhost:3002
  security:
    issuer-uri: http://localhost:16801

spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            websocket:
              max-frame-payload-length: 10485760
          discovery:
            locator:
              lower-case-service-id: true
              enabled: true
          routes:
            - id: iam-pat-api
              uri: http://localhost:16801
              order: -1
              predicates:
                - Path=/api/front/pat/**
              filters:
                - TokenRelay=
                - SaveSession=
                - RewritePath=/api/front/pat(?<segment>/?.*), /api/v1/iam/pat${segment}

            - id: iam-tenant-api
              uri: http://localhost:16801
              order: -1
              predicates:
                - Path=/api/front/tenants/**
              filters:
                - TokenRelay=
                - SaveSession=
                - RewritePath=/api/front/tenants(?<segment>/?.*), /api/v1/iam/tenants${segment}

            - id: gateway-service-gateways-api
              uri: http://localhost:16803
              order: -1
              predicates:
                - Path=/api/front/gateways/**
              filters:
                - TokenRelay=
                - SaveSession=
                - RewritePath=/api/front/gateways(?<segment>/?.*), /api/v1/gateways${segment}

            - id: gateway-service-services-api
              uri: http://localhost:16803
              order: -1
              predicates:
                - Path=/api/front/services/**
              filters:
                - TokenRelay=
                - SaveSession=
                - RewritePath=/api/front/services(?<segment>/?.*), /api/v1/services${segment}

            - id: gateway-service-routes-api
              uri: http://localhost:16803
              order: -1
              predicates:
                - Path=/api/front/routes/**
              filters:
                - TokenRelay=
                - SaveSession=
                - RewritePath=/api/front/routes(?<segment>/?.*), /api/v1/routes${segment}

            - id: consumer-service-api
              uri: http://localhost:16804
              order: -1
              predicates:
                - Path=/api/front/consumers/**
              filters:
                - TokenRelay=
                - SaveSession=
                - RewritePath=/api/front/consumers(?<segment>/?.*), /api/v1/consumers${segment}

            - id: iam-service-api
              uri: http://localhost:16801
              predicates:
                - Path=/api/front/**
              filters:
                - TokenRelay=
                - SaveSession=
                - RewritePath=/api/front/(?<segment>.*), /api/v1/iam/${segment}

            - id: iam-ui
              uri: http://localhost:3002
              predicates:
                - Path=/dashboard/iam/**, /iam-static/**

            - id: gateway-ui
              uri: http://localhost:3001
              predicates:
                - Path=/dashboard/**, /gateway-static/**

            - id: public-ui
              uri: http://localhost:3000
              predicates:
                - Path=/**

  security:
    oauth2:
      client:
        provider:
          stadoor:
            issuer-uri: ${stadoor.security.issuer-uri}
        registration:
          stadoor:
            provider: stadoor
            client-id: stadoor
            client-secret: ${CLIENT_SECRET}
            redirect-uri: "http://localhost:16901/login/oauth2/code/stadoor"
            scope:
              - openid
              - profile
              - email
              - offline_access

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
